name: C070 backend offline checks

on:
  pull_request:
    paths:
      - 'scripts/c070_station_registry.py'
      - 'scripts/update_metar.py'
      - 'scripts/update_taf.py'
      - 'tests/test_update_taf.py'
      - 'tests/test_c070_station_registry.py'
      - 'tests/test_update_metar.py'
      - 'tests/test_updater_airports.py'
      - 'tests/test_c070_registry.py'
      - 'tests/airport-storage.test.cjs'
      - 'app.js'
      - 'docs/reference/c070-airport-registry.json'
      - 'docs/reference/c070-airports.csv'
      - '.github/workflows/c070-backend-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c070-metar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate C070 registry and weather collectors offline
        run: |
          python -m unittest discover -s tests -p 'test_c070_station_registry.py'
          python -m unittest discover -s tests -p 'test_c070_registry.py'
          python -m unittest discover -s tests -p 'test_updater_airports.py'
          python -m unittest discover -s tests -p 'test_update_metar.py'
          python -m unittest discover -s tests -p 'test_update_taf.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independent dashboard airport limit offline
        run: node --test tests/airport-storage.test.cjs
