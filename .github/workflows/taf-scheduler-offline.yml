name: TAF scheduler offline checks
on:
  pull_request:
    paths:
      - 'workers/spatchin-taf-scheduler/**'
      - '.github/workflows/taf-scheduler-offline.yml'
      - 'docs/CLOUDFLARE_TAF_SCHEDULER.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  taf-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: workers/spatchin-taf-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Compile Worker without deploying
        run: npm run deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      # No live dispatch, provider calls, secrets or Cloudflare deployment.
