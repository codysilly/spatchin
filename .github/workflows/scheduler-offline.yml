name: Scheduler offline checks
on:
  pull_request:
    paths:
      - 'workers/shared/**'
      - 'workers/spatchin-atis-scheduler/**'
      - 'workers/spatchin-metar-scheduler/**'
      - 'workers/spatchin-taf-scheduler/**'
      - '.github/workflows/scheduler-offline.yml'
      - 'docs/SHARED_SCHEDULERS.md'
      - 'docs/CLOUDFLARE_ATIS_SCHEDULER.md'
      - 'docs/CLOUDFLARE_METAR_SCHEDULER.md'
      - 'docs/CLOUDFLARE_TAF_SCHEDULER.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        scheduler: [atis, metar, taf]
    defaults:
      run:
        working-directory: workers/spatchin-${{ matrix.scheduler }}-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Compile Worker without deploying
        run: npm run deploy:dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      # No live dispatch, provider calls, secrets or Cloudflare deployment.
