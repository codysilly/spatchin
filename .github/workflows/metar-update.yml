name: Update METAR Data
on:
  workflow_dispatch:
  schedule:
    # Keep separate hourly schedules. GitHub was starting the equivalent
    # comma-list schedule only every few hours instead of every ten minutes.
    - cron: '7 * * * *'
    - cron: '17 * * * *'
    - cron: '27 * * * *'
    - cron: '37 * * * *'
    - cron: '47 * * * *'
    - cron: '57 * * * *'
permissions:
  contents: write
concurrency:
  group: spatchin-metar-update
  cancel-in-progress: false
jobs:
  update-metar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve METAR observations with retries
        run: python scripts/update_metar.py
      - name: Commit updated METAR data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metars.json
          if ! git diff --cached --quiet; then
            git commit -m "Update METAR observations"
            git push
          fi
