name: Update METAR Data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spatchin-metar-update
  cancel-in-progress: false
jobs:
  update-metar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve METAR observations with retries
        run: python scripts/update_metar.py
      - name: Evaluate METAR freshness (offline)
        run: python scripts/metar_watchdog.py evaluate
      - name: Commit updated METAR data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metars.json
          if [ -f .github/metar-watchdog-state.json ]; then
            git add .github/metar-watchdog-state.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update METAR observations"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            echo "Failed to publish METAR after three push attempts" >&2
            exit 1
          fi
      - name: Report collection heartbeat (no extra AWC request)
        env:
          SPATCHIN_METAR_HEARTBEAT_URL: ${{ secrets.SPATCHIN_METAR_HEARTBEAT_URL }}
        run: python scripts/metar_watchdog.py notify
