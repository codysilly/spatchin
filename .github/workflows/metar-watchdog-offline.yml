name: METAR Watchdog Offline

on:
  pull_request:
    paths:
      - scripts/metar_watchdog.py
      - tests/test_metar_watchdog.py
      - .github/workflows/metar-update.yml
      - .github/workflows/metar-watchdog-offline.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic offline watchdog tests
        run: python -m unittest discover -s tests -p 'test_metar_watchdog.py' -v
