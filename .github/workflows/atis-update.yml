name: Update ATIS Data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: spatchin-atis-update
  cancel-in-progress: false
jobs:
  update-atis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate offline ATIS collector
        run: python -m unittest discover -s tests -p 'test_update_atis.py'
      - name: Retrieve atis.info ATIS snapshots
        run: python scripts/update_atis.py
      - name: Commit ATIS data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/atis.json
          if ! git diff --cached --quiet; then
            git commit -m "Update ATIS snapshot"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main
            done
            echo "Failed to publish ATIS after three push attempts" >&2
            exit 1
          fi
