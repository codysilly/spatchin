name: Frontend offline checks
on:
  pull_request:
    paths:
      - 'app.js'
      - 'airport-catalog.js'
      - 'scripts/build_airport_catalog.mjs'
      - 'docs/reference/c070-airport-registry.json'
      - 'docs/reference/c070-airports.csv'
      - 'tests/c070-metar-dashboard.test.cjs'
      - 'taf-reader.js'
      - 'taf-timeline.js'
      - 'tests/taf-timeline.test.cjs'
      - 'tests/taf-timeline-browser.test.cjs'
      - 'tests/taf-reader.test.cjs'
      - 'scripts/update_taf.py'
      - 'tests/test_update_taf.py'
      - '.github/workflows/taf-update.yml'
      - 'index.html'
      - 'dashboard/index.html'
      - '_config.yml'
      - 'tests/public-pages-config.test.cjs'
      - 'tests/site-routing.test.cjs'
      - 'tests/site-routing-browser.test.cjs'
      - '*.css'
      - 'tests/charcoal-dashboard.test.cjs'
      - 'tests/atis-reader.test.cjs'
      - 'tests/airport-storage.test.cjs'
      - 'tests/charcoal-dashboard-browser.test.cjs'
      - 'assets/branding/**'
      - 'BRANDING.md'
      - 'scripts/render-brand-icons.py'
      - 'tests/branding-assets.test.cjs'
      - 'tests/ui-style-baseline-browser.test.cjs'
      - 'tests/css-parity-browser.test.cjs'
      - 'UI_DESIGN.md'
      - 'DASHBOARD.md'
      - '.github/workflows/frontend-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check airport-catalog.js
          node scripts/build_airport_catalog.mjs --check
          node --check taf-reader.js
          node --check taf-timeline.js
          node --check scan.js
          node --check notam-reader.js
          node --check notam-snapshots.js
      - name: Run offline frontend regressions
        run: |
          node --test tests/public-pages-config.test.cjs tests/site-routing.test.cjs tests/charcoal-dashboard.test.cjs tests/atis-reader.test.cjs tests/airport-storage.test.cjs tests/c070-metar-dashboard.test.cjs tests/runway-notam-tables.test.cjs tests/notam-reader.test.cjs tests/branding-assets.test.cjs tests/taf-reader.test.cjs tests/taf-timeline.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test TAF collector using synthetic responses
        run: python -m unittest discover -s tests -p 'test_update_taf.py'
      # Temporary branch-only lockfile preparation; remove before merge.
      - name: Resolve pinned SPA-103 quality tools
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/spa-103-formatting-test-prep'
        shell: bash
        run: |
          set -euo pipefail
          quality_dir="$(mktemp -d "$RUNNER_TEMP/spatchin-quality.XXXXXX")"
          cp package.json package-lock.json "$quality_dir/"
          npm --prefix "$quality_dir" install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact --registry=https://registry.npmjs.org prettier@3.6.2 eslint@9.39.1
          npm --prefix "$quality_dir" ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          "$quality_dir/node_modules/.bin/prettier" --version
          "$quality_dir/node_modules/.bin/eslint" --version
          "$quality_dir/node_modules/.bin/eslint" --config .github/quality/eslint.config.mjs --print-config app.js > /dev/null
          "$quality_dir/node_modules/.bin/prettier" --config .github/quality/prettier.json --check .github/quality/prettier.json
          python -m venv "$quality_dir/ruff-env"
          "$quality_dir/ruff-env/bin/python" -m pip install --disable-pip-version-check --no-input ruff==0.11.13
          "$quality_dir/ruff-env/bin/ruff" --version
          "$quality_dir/ruff-env/bin/ruff" check --config .github/quality/ruff.toml --show-settings scripts/update_taf.py > /dev/null
          # Only public npm package metadata may be emitted; never print environment variables.
          node - "$quality_dir" <<'NODE'
          const fs = require('node:fs');
          const dir = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(dir + '/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync(dir + '/package-lock.json', 'utf8'));
          for (const entry of Object.values(lock.packages)) {
            if (!entry.resolved) continue;
            const url = new URL(entry.resolved);
            if (url.protocol !== 'https:' || url.hostname !== 'registry.npmjs.org' || url.username || url.password || url.search || url.hash) {
              throw new Error('Unexpected npm package registry');
            }
          }
          for (const [label, value] of [['MANIFEST', manifest], ['LOCK', lock]]) {
            console.log('SPA103_' + label + '_BEGIN');
            console.log(JSON.stringify(value, null, 2));
            console.log('SPA103_' + label + '_END');
          }
          NODE
      - name: Install local browser test harness
        run: npm install --no-save --no-package-lock playwright@1.56.1 pngjs@7.0.0 pixelmatch@5.3.0
      - name: Run synthetic desktop and mobile checks
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || true)"
          node --test tests/site-routing-browser.test.cjs tests/charcoal-dashboard-browser.test.cjs tests/ui-style-baseline-browser.test.cjs tests/runway-tables-browser.test.cjs tests/taf-timeline-browser.test.cjs
      - name: Fetch SPA-67 baseline for parity check
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/spa-68-css-consolidation'
        run: git fetch --no-tags --depth=1 origin 5120d81945787a5c80da738bf5e086a4105e0a1c
      - name: Compare all rendered CSS against SPA-67 baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/spa-68-css-consolidation'
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || true)"
          node --test tests/css-parity-browser.test.cjs
      - name: Retain visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatchin-charcoal-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
