name: Frontend offline checks
on:
  pull_request:
    paths:
      - 'app.js'
      - 'airport-catalog.js'
      - 'scripts/build_airport_catalog.mjs'
      - 'docs/reference/c070-airport-registry.json'
      - 'docs/reference/c070-airports.csv'
      - 'tests/c070-metar-dashboard.test.cjs'
      - 'taf-reader.js'
      - 'taf-timeline.js'
      - 'tests/taf-timeline.test.cjs'
      - 'tests/taf-timeline-browser.test.cjs'
      - 'tests/taf-reader.test.cjs'
      - 'scripts/update_taf.py'
      - 'tests/test_update_taf.py'
      - '.github/workflows/taf-update.yml'
      - 'index.html'
      - 'dashboard/index.html'
      - '_config.yml'
      - 'tests/public-pages-config.test.cjs'
      - 'tests/site-routing.test.cjs'
      - 'tests/site-routing-browser.test.cjs'
      - '*.css'
      - 'tests/charcoal-dashboard.test.cjs'
      - 'tests/atis-reader.test.cjs'
      - 'tests/airport-storage.test.cjs'
      - 'tests/charcoal-dashboard-browser.test.cjs'
      - 'assets/branding/**'
      - 'BRANDING.md'
      - 'scripts/render-brand-icons.py'
      - 'tests/branding-assets.test.cjs'
      - 'tests/ui-style-baseline-browser.test.cjs'
      - 'tests/css-parity-browser.test.cjs'
      - 'UI_DESIGN.md'
      - 'DASHBOARD.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/quality/**'
      - 'scripts/**/*.py'
      - 'tests/**/*.py'
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '.github/workflows/frontend-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check airport-catalog.js
          node scripts/build_airport_catalog.mjs --check
          node --check taf-reader.js
          node --check taf-timeline.js
          node --check scan.js
          node --check notam-reader.js
          node --check notam-snapshots.js
      - name: Run offline frontend regressions
        run: |
          node --test tests/public-pages-config.test.cjs tests/site-routing.test.cjs tests/charcoal-dashboard.test.cjs tests/atis-reader.test.cjs tests/airport-storage.test.cjs tests/c070-metar-dashboard.test.cjs tests/runway-notam-tables.test.cjs tests/notam-reader.test.cjs tests/branding-assets.test.cjs tests/taf-reader.test.cjs tests/taf-timeline.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test TAF collector using synthetic responses
        run: python -m unittest discover -s tests -p 'test_update_taf.py'
      - name: Install pinned frontend and quality tools
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Install pinned Ruff
        run: |
          python -m venv "$RUNNER_TEMP/spatchin-ruff"
          "$RUNNER_TEMP/spatchin-ruff/bin/python" -m pip install --disable-pip-version-check --no-input --only-binary=:all: ruff==0.11.13
          echo "$RUNNER_TEMP/spatchin-ruff/bin" >> "$GITHUB_PATH"
      # Temporary, branch-only mechanical formatting evidence. Remove before merge.
      - name: Generate initial mechanical formatting baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/spa-103-formatting-test-prep'
        run: |
          npm run format
          node <<'NODE'
          const fs = require('node:fs');
          const paths = ["scripts/run-node-tests.cjs","tests/branding-assets.test.cjs","tests/charcoal-dashboard.test.cjs","tests/taf-reader.test.cjs","tests/taf-timeline.test.cjs","tests/test_update_taf.py"];
          // Only listed test/helper sources; never aviation data, captures or environment variables.
          console.log('SPA103_FORMAT_BEGIN');
          for (const path of paths) {
            const content = fs.readFileSync(path, 'utf8');
            for (let i = 0; i < content.length; i += 1000) console.log(JSON.stringify([path, content.slice(i, i + 1000)]));
          }
          console.log('SPA103_FORMAT_END');
          NODE
      - name: Verify formatting and lint baseline
        run: |
          npm run format:check
          npm run lint
      - name: Run synthetic desktop and mobile checks
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || true)"
          node --test tests/site-routing-browser.test.cjs tests/charcoal-dashboard-browser.test.cjs tests/ui-style-baseline-browser.test.cjs tests/runway-tables-browser.test.cjs tests/taf-timeline-browser.test.cjs
      - name: Fetch SPA-67 baseline for parity check
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/spa-68-css-consolidation'
        run: git fetch --no-tags --depth=1 origin 5120d81945787a5c80da738bf5e086a4105e0a1c
      - name: Compare all rendered CSS against SPA-67 baseline
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/spa-68-css-consolidation'
        run: |
          export CHROMIUM_PATH="$(command -v google-chrome || command -v chromium || true)"
          node --test tests/css-parity-browser.test.cjs
      - name: Retain visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatchin-charcoal-screenshots
          path: screenshots/*.png
          if-no-files-found: ignore
