name: ATIS offline checks
on:
  pull_request:
    paths:
      - 'scripts/update_atis.py'
      - 'tests/test_update_atis.py'
      - '.github/workflows/atis-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline ATIS tests (no provider requests)
        run: python -m unittest discover -s tests -p 'test_update_atis.py' -v
